<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    #cartBtn {
      background: white;
      color: #111;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .search {
      text-align: center;
      padding: 25px;
    }

    .search input {
      width: 90%;
      max-width: 500px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      outline: none;
    }

    .products {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      padding-bottom: 40px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      margin: 12px 0 6px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .product button {
      width: 100%;
      padding: 10px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .product button:hover {
      background: #333;
    }

    /* Cart */

    .cart {
      position: fixed;
      right: -400px;
      top: 0;
      width: 350px;
      max-width: 90%;
      height: 100%;
      background: white;
      padding: 20px;
      box-shadow: -3px 0 12px rgba(0,0,0,0.2);
      transition: 0.3s;
      z-index: 10;
    }

    .cart.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .close {
      cursor: pointer;
      font-size: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .quantity button {
      padding: 3px 8px;
      margin: 0 3px;
      cursor: pointer;
    }

    .total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>MiniShop</h1>
    <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
  </header>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Search products..."
    >
  </div>

  <main class="products" id="products"></main>

  <!-- Cart -->
  <div class="cart" id="cart">

    <div class="cart-header">
      <h2>Your Cart</h2>
      <span class="close" onclick="closeCart()">✕</span>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <button class="checkout" onclick="checkout()">
      Checkout
    </button>

  </div>

  <script>

    const products = [
      {
        id: 1,
        name: "Wireless Headphones",
        price: 999,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
      },
      {
        id: 2,
        name: "Smart Watch",
        price: 1499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
      },
      {
        id: 3,
        name: "Running Shoes",
        price: 1999,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
      },
      {
        id: 4,
        name: "Backpack",
        price: 799,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62"
      }
    ];

    let cart = [];

    const productsContainer = document.getElementById("products");

    function displayProducts(list) {

      productsContainer.innerHTML = "";

      list.forEach(product => {

        productsContainer.innerHTML += `
          <div class="product">

            <img src="${product.image}" alt="${product.name}">

            <h3>${product.name}</h3>

            <div class="price">
              ₹${product.price}
            </div>

            <button onclick="addToCart(${product.id})">
              Add to Cart
            </button>

          </div>
        `;
      });
    }

    function addToCart(id) {

      const item = cart.find(product => product.id === id);

      if (item) {
        item.quantity++;
      } else {

        const product = products.find(product => product.id === id);

        cart.push({
          ...product,
          quantity: 1
        });
      }

      updateCart();
    }

    function updateCart() {

      const cartItems = document.getElementById("cartItems");

      cartItems.innerHTML = "";

      let total = 0;
      let count = 0;

      cart.forEach(item => {

        total += item.price * item.quantity;
        count += item.quantity;

        cartItems.innerHTML += `
          <div class="cart-item">

            <div>
              <strong>${item.name}</strong>
              <br>
              ₹${item.price}
            </div>

            <div class="quantity">

              <button onclick="changeQuantity(${item.id}, -1)">
                -
              </button>

              ${item.quantity}

              <button onclick="changeQuantity(${item.id}, 1)">
                +
              </button>

            </div>

          </div>
        `;
      });

      document.getElementById("total").textContent = total;
      document.getElementById("cartCount").textContent = count;
    }

    function changeQuantity(id, amount) {

      const item = cart.find(product => product.id === id);

      item.quantity += amount;

      if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
      }

      updateCart();
    }

    document.getElementById("cartBtn").onclick = () => {
      document.getElementById("cart").classList.add("active");
    };

    function closeCart() {
      document.getElementById("cart").classList.remove("active");
    }

    document.getElementById("search").addEventListener("input", function() {

      const searchText = this.value.toLowerCase();

      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(searchText)
      );

      displayProducts(filtered);
    });

    function checkout() {

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      alert("Order placed successfully! 🎉");

      cart = [];
      updateCart();
      closeCart();
    }

    displayProducts(products);

  </script>

</body>
</html>
